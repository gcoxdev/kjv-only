version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vite-and-vitest:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - "@vitest/*"
      vite-and-vitest-security:
        applies-to: security-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - vitest
          - "@vitest/*"
      lexical:
        patterns:
          - lexical
          - "@lexical/*"
      lexical-security:
        applies-to: security-updates
        patterns:
          - lexical
          - "@lexical/*"
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        # These releases pull conflicting optional Babel peers during npm resolution.
        versions:
          - "6.1.1"
          - "6.1.2"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
